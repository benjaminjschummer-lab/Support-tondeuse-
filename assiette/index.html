<title>Mon Assiette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, phone-first. Day gauge on top, one big "photo" action, then the day's plates. */
:root {
  --bg: #F2F4EE;
  --card: #FFFFFF;
  --ink: #1C2620;
  --muted: #66716A;
  --line: #DDE2D8;
  --accent: #3E7C3A;
  --accent-ink: #FFFFFF;
  --fat: #CF6A35;
  --sugar: #C79A1E;
  --prot: #4B6FA8;
  --ok: #3E7C3A;
  --warn: #C27C12;
  --bad: #B8432F;
  --soft: #E6EBE0;
  --f-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121713; --card: #1B221C; --ink: #E8EEE6; --muted: #98A39A; --line: #2C362E;
  --accent: #79B66F; --accent-ink: #0E140F; --fat: #E48A57; --sugar: #DDB547; --prot: #84A4DA;
  --ok: #79B66F; --warn: #E0A23E; --bad: #E2735E; --soft: #232C24; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121713; --card: #1B221C; --ink: #E8EEE6; --muted: #98A39A; --line: #2C362E;
  --accent: #79B66F; --accent-ink: #0E140F; --fat: #E48A57; --sugar: #DDB547; --prot: #84A4DA;
  --ok: #79B66F; --warn: #E0A23E; --bad: #E2735E; --soft: #232C24; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 18px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
.daynav { display: flex; align-items: center; gap: 4px; }
.daynav button { background: none; border: 0; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.daynav button:hover:not(:disabled) { background: var(--soft); color: var(--ink); }
.daynav button:disabled { opacity: .3; cursor: default; }
.daynav .lbl { font-weight: 600; min-width: 110px; text-align: center; font-size: .95rem; }

/* Gauge */
.gauge { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; grid-template-columns: 132px 1fr; gap: 18px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-family: var(--f-display); font-size: 1.9rem; font-weight: 800; line-height: 1; }
.ring .sub { font-size: .72rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 4px; }
.bars { display: flex; flex-direction: column; gap: 11px; min-width: 0; }
.bar .top { display: flex; justify-content: space-between; font-size: .82rem; margin-bottom: 4px; gap: 6px; }
.bar .top span:first-child { font-weight: 600; }
.bar .top span:last-child { color: var(--muted); }
.track { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 4px; transition: width .4s; }
@media (max-width: 400px) { .gauge { grid-template-columns: 1fr; justify-items: center; } .bars { width: 100%; } }

/* Advice */
.advice { border-radius: 16px; padding: 14px 16px; background: var(--soft); display: flex; flex-direction: column; gap: 6px; }
.advice .head { display: flex; align-items: center; gap: 8px; }
.pill { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; color: var(--accent-ink); }
.pill.ok { background: var(--ok); } .pill.reste { background: var(--prot); } .pill.stop { background: var(--bad); } .pill.wait { background: var(--muted); }
.advice h3 { font-size: 1.02rem; font-weight: 700; }
.advice p { margin: 0; color: var(--ink); }
.advice ul { margin: 2px 0 0; padding-left: 18px; }
.advice li { margin: 2px 0; }
.advice .refresh { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: .85rem; }

/* Capture */
.capture { display: flex; flex-direction: column; gap: 10px; }
.photo-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 18px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.photo-btn:hover { filter: brightness(1.06); }
.photo-btn svg { width: 26px; height: 26px; }
.say { display: flex; gap: 8px; align-items: stretch; }
.say textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 14px; padding: 11px 13px; font: inherit; min-height: 46px; height: 46px; }
.say button { border: 1px solid var(--line); background: var(--card); border-radius: 14px; width: 48px; flex: none; display: grid; place-items: center; }
.say button.send { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.say button.rec { background: var(--bad); color: #fff; border-color: var(--bad); }
.say svg { width: 20px; height: 20px; }
.preview { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
.preview img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
.preview .t { flex: 1; font-size: .88rem; color: var(--muted); }
.preview button { background: none; border: 0; color: var(--muted); font-size: .85rem; text-decoration: underline; }
.status { font-size: .88rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.status.err { color: var(--bad); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: sp 0.8s linear infinite; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .track i { transition: none; } }

/* Meals */
.sect { display: flex; justify-content: space-between; align-items: baseline; }
.sect h2 { font-size: 1.1rem; font-weight: 700; }
.sect span { color: var(--muted); font-size: .82rem; }
.meals { display: flex; flex-direction: column; gap: 10px; }
.meal { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; grid-template-columns: 60px 1fr auto; gap: 12px; align-items: start; }
.meal .thumb { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; background: var(--soft); display: grid; place-items: center; color: var(--muted); }
.meal .thumb svg { width: 26px; height: 26px; }
.meal .body { min-width: 0; }
.meal .when { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.meal h3 { font-family: var(--f-body); font-size: .98rem; font-weight: 600; margin: 1px 0 4px; }
.meal .items { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.chip { font-size: .72rem; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.fat { border-color: var(--fat); color: var(--fat); }
.chip.sugar { border-color: var(--sugar); color: var(--sugar); }
.meal .kcal { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.meal .kcal b { font-family: var(--f-display); font-size: 1.25rem; font-weight: 800; line-height: 1; }
.meal .kcal small { color: var(--muted); font-size: .72rem; }
.meal .del { background: none; border: 0; color: var(--muted); font-size: .76rem; padding: 2px 0; }
.meal .del:hover { color: var(--bad); }
.meal .del.confirm { color: var(--bad); font-weight: 600; }
.meal .note { grid-column: 2 / 4; font-size: .82rem; color: var(--muted); font-style: italic; margin-top: -4px; }
.empty { border: 1.5px dashed var(--line); border-radius: 16px; padding: 22px; text-align: center; color: var(--muted); }

/* Week */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 92px; }
.week button { background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.week .col { width: 100%; max-width: 30px; border-radius: 6px 6px 3px 3px; background: var(--soft); position: relative; }
.week .col.has { background: var(--accent); opacity: .55; }
.week .col.over { background: var(--fat); opacity: .7; }
.week button.cur .col { opacity: 1; }
.week small { font-size: .7rem; color: var(--muted); }
.week button.cur small { color: var(--ink); font-weight: 700; }

/* Settings */
details.settings { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; }
details.settings summary { cursor: pointer; padding: 10px 0; font-weight: 600; font-size: .92rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; padding-bottom: 14px; }
.grid label { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: var(--muted); }
.grid input, .grid select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
.settings .row { display: flex; gap: 10px; align-items: center; padding-bottom: 14px; flex-wrap: wrap; }
.settings .row button { border: 0; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.settings .hint { font-size: .78rem; color: var(--muted); }
.foot { font-size: .75rem; color: var(--muted); text-align: center; }
</style>

<div class="wrap">
  <header>
    <h1>Mon Assiette</h1>
    <div class="daynav">
      <button id="prev" aria-label="Jour précédent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span class="lbl" id="dayLbl">Aujourd'hui</span>
      <button id="next" aria-label="Jour suivant"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>

  <section class="gauge" aria-label="Bilan du jour">
    <div class="ring">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--soft)" stroke-width="12"/><circle id="ringArc" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
      <div class="c"><div class="big num" id="kcalLeft">2000</div><div class="sub" id="kcalSub">kcal restantes</div></div>
    </div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="advice" id="advice" aria-live="polite"></section>

  <section class="capture">
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
    <button class="photo-btn" id="photoBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Photographier mon assiette
    </button>
    <div class="preview" id="preview" hidden><img id="prevImg" alt="Photo du repas"><span class="t">Photo prête. Ajoute un détail si tu veux, puis envoie.</span><button id="prevX">retirer</button></div>
    <div class="say">
      <textarea id="txt" rows="1" placeholder="Ou dis-moi : « 2 tartines Nutella et un café »"></textarea>
      <button id="mic" aria-label="Dicter" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
      <button class="send" id="send" aria-label="Envoyer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="status" id="status" hidden></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="sect"><h2 id="mealsTitle">Ce que tu as mangé</h2><span id="mealsCount"></span></div>
    <div class="meals" id="meals"></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="sect"><h2>7 derniers jours</h2><span id="weekAvg"></span></div>
    <div class="week" id="week"></div>
  </section>

  <details class="settings" id="settings">
    <summary>Mes objectifs</summary>
    <div class="grid">
      <label>Calories / jour<input id="sKcal" type="number" min="800" max="5000" step="50"></label>
      <label>Lipides max (g)<input id="sFat" type="number" min="10" max="250"></label>
      <label>Sucres max (g)<input id="sSugar" type="number" min="5" max="250"></label>
      <label>Protéines visées (g)<input id="sProt" type="number" min="10" max="300"></label>
    </div>
    <div class="grid">
      <label>Sexe<select id="pSex"><option value="">—</option><option value="h">Homme</option><option value="f">Femme</option></select></label>
      <label>Âge<input id="pAge" type="number" min="12" max="100"></label>
      <label>Poids (kg)<input id="pW" type="number" min="30" max="250"></label>
      <label>Taille (cm)<input id="pH" type="number" min="120" max="230"></label>
      <label>Activité<select id="pAct"><option value="1.3">Plutôt assis</option><option value="1.5">Un peu actif</option><option value="1.7">Sportif</option></select></label>
      <label>Objectif<select id="pGoal"><option value="lose">Perdre un peu</option><option value="keep">Maintenir</option><option value="gain">Prendre</option></select></label>
    </div>
    <div class="row"><button id="calc">Calculer mes objectifs</button><button id="saveS">Enregistrer</button><span class="hint" id="sHint"></span></div>
  </details>

  <p class="foot">Les valeurs sont des estimations faites par Claude à partir de la photo ou de ta description.</p>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const [y,m,d] = s.split("-").map(Number); return ymd(new Date(y, m-1, d+n)); };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R = 326.7;

const DEF = { kcal: 2000, fat: 70, sugar: 50, prot: 90 };
let profile = { ...DEF };
let docs = {};          // id -> data (meals + advice)
let day = today();
let photoBlob = null, photoThumb = null;
let sample = null, store = null, dict = null;

/* ---------- storage: db per user, else localStorage ---------- */
const LS = "assiette.v1";
const local = {
  read() { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch { return {}; } },
  write(all) { try { localStorage.setItem(LS, JSON.stringify(all)); } catch {} }
};
function makeLocalStore() {
  return {
    kind: "local",
    async put(id, data) { const a = local.read(); a[id] = data; local.write(a); docs = a; render(); },
    async del(id) { const a = local.read(); delete a[id]; local.write(a); docs = a; render(); },
    start() { docs = local.read(); if (docs.profile) profile = { ...DEF, ...docs.profile }; render(); }
  };
}
async function makeDbStore(db, uid) {
  const col = db.collection("data/users/" + uid);
  return {
    kind: "db",
    async put(id, data) { docs[id] = data; render(); await col.doc(id).set(data); },
    async del(id) { delete docs[id]; render(); await col.doc(id).delete(); },
    start() {
      col.onSnapshot(snap => {
        const next = {};
        snap.docs.forEach(d => { next[d.id] = d.data(); });
        docs = next;
        if (docs.profile) profile = { ...DEF, ...docs.profile };
        render();
      }, e => showStatus("Je n'arrive pas à charger ton historique (" + e.code + ").", true));
    }
  };
}

/* ---------- derived ---------- */
const mealsOf = d => Object.entries(docs).filter(([, v]) => v && v.kind === "meal" && v.date === d)
  .map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
const totals = list => list.reduce((t, m) => ({
  kcal: t.kcal + (+m.kcal || 0), fat: t.fat + (+m.lipides_g || 0), sugar: t.sugar + (+m.sucres_g || 0),
  prot: t.prot + (+m.proteines_g || 0), carbs: t.carbs + (+m.glucides_g || 0)
}), { kcal: 0, fat: 0, sugar: 0, prot: 0, carbs: 0 });

function slotOf(ts) {
  const h = new Date(ts).getHours();
  if (h < 11) return "Petit-déj"; if (h < 15) return "Midi"; if (h < 18) return "Goûter"; if (h < 22) return "Soir"; return "Tard";
}
function dayLabel(d) {
  const t = today();
  if (d === t) return "Aujourd'hui";
  if (d === addDays(t, -1)) return "Hier";
  const [y,m,dd] = d.split("-").map(Number);
  return new Date(y, m-1, dd).toLocaleDateString("fr-BE", { weekday: "short", day: "numeric", month: "short" });
}

/* ---------- render ---------- */
function render() {
  const list = mealsOf(day), t = totals(list);
  $("dayLbl").textContent = dayLabel(day);
  $("next").disabled = day >= today();

  const left = Math.round(profile.kcal - t.kcal);
  const frac = Math.min(t.kcal / profile.kcal, 1);
  const over = left < 0;
  $("ringArc").setAttribute("stroke-dashoffset", (R * (1 - frac)).toFixed(1));
  $("ringArc").setAttribute("stroke", over ? "var(--bad)" : (frac > .9 ? "var(--warn)" : "var(--accent)"));
  $("kcalLeft").textContent = Math.abs(left);
  $("kcalSub").textContent = over ? "kcal de trop" : "kcal restantes";

  const bar = (name, v, max, color, kind) => {
    const pct = Math.min(v / max * 100, 100);
    const c = (kind === "max" && v > max) ? "var(--bad)" : color;
    const right = kind === "max" ? `${Math.round(v)} / ${max} g max` : `${Math.round(v)} / ${max} g`;
    return `<div class="bar"><div class="top"><span>${name}</span><span class="num">${right}</span></div><div class="track"><i style="width:${pct}%;background:${c}"></i></div></div>`;
  };
  $("bars").innerHTML =
    `<div class="bar"><div class="top"><span>Calories</span><span class="num">${Math.round(t.kcal)} / ${profile.kcal} kcal</span></div></div>` +
    bar("Gras (lipides)", t.fat, profile.fat, "var(--fat)", "max") +
    bar("Sucres", t.sugar, profile.sugar, "var(--sugar)", "max") +
    bar("Protéines", t.prot, profile.prot, "var(--prot)", "goal");

  // meals
  $("mealsTitle").textContent = day === today() ? "Ce que tu as mangé" : "Repas de ce jour";
  $("mealsCount").textContent = list.length ? `${list.length} prise${list.length > 1 ? "s" : ""}` : "";
  $("meals").innerHTML = list.length ? list.map(m => {
    const chips = [];
    if (m.gras === "élevé") chips.push('<span class="chip fat">gras</span>');
    if (m.sucre === "élevé") chips.push('<span class="chip sugar">sucré</span>');
    chips.push(`<span class="chip num">L ${Math.round(m.lipides_g||0)} g</span>`);
    chips.push(`<span class="chip num">S ${Math.round(m.sucres_g||0)} g</span>`);
    chips.push(`<span class="chip num">P ${Math.round(m.proteines_g||0)} g</span>`);
    const items = (m.aliments || []).map(a => a.quantite ? `${a.nom} (${a.quantite})` : a.nom).join(", ");
    const when = new Date(m.ts).toLocaleTimeString("fr-BE", { hour: "2-digit", minute: "2-digit" });
    return `<article class="meal">
      ${m.thumb ? `<img class="thumb" src="${esc(m.thumb)}" alt="">` : `<div class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/></svg></div>`}
      <div class="body"><div class="when">${slotOf(m.ts)} · ${when}</div><h3>${esc(m.titre)}</h3><div class="items">${esc(items)}</div><div class="chips">${chips.join("")}</div></div>
      <div class="kcal"><b class="num">${Math.round(m.kcal||0)}</b><small>kcal</small><button class="del" data-id="${esc(m.id)}">supprimer</button></div>
      ${m.remarque ? `<div class="note">${esc(m.remarque)}</div>` : ""}
    </article>`;
  }).join("") : `<div class="empty">${day === today() ? "Rien encore aujourd'hui. Prends ton assiette en photo, je m'occupe du reste." : "Rien de noté ce jour-là."}</div>`;

  // week
  const days = Array.from({ length: 7 }, (_, i) => addDays(today(), i - 6));
  const vals = days.map(d => totals(mealsOf(d)).kcal);
  const maxV = Math.max(profile.kcal * 1.2, ...vals);
  $("week").innerHTML = days.map((d, i) => {
    const v = vals[i], h = v ? Math.max(6, v / maxV * 70) : 6;
    const cls = v > profile.kcal * 1.05 ? "over" : (v ? "has" : "");
    const [y,m,dd] = d.split("-").map(Number);
    const wd = new Date(y, m-1, dd).toLocaleDateString("fr-BE", { weekday: "narrow" });
    return `<button data-day="${d}" class="${d === day ? "cur" : ""}" title="${dayLabel(d)} : ${Math.round(v)} kcal"><div class="col ${cls}" style="height:${h}px"></div><small>${wd}</small></button>`;
  }).join("");
  const filled = vals.filter(Boolean);
  $("weekAvg").textContent = filled.length ? `moyenne ${Math.round(filled.reduce((a,b)=>a+b,0)/filled.length)} kcal` : "";

  renderAdvice(list, t);
  fillSettings();
}

function renderAdvice(list, t) {
  const el = $("advice");
  const a = docs["advice_" + day];
  if (!list.length) {
    el.innerHTML = `<div class="head"><span class="pill wait">Conseil</span></div><p>${day === today() ? "Dès ton premier repas noté, je te dis où tu en es et ce qu'il te reste comme marge." : "Pas de repas ce jour-là."}</p>`;
    return;
  }
  if (adviceBusy) { el.innerHTML = `<div class="status"><span class="spin"></span>Je regarde ta journée…</div>`; return; }
  if (!a) {
    el.innerHTML = `<div class="head"><span class="pill wait">Conseil</span></div><p>Pas encore de bilan pour ce jour.</p>${sample ? '<button class="refresh" id="advBtn">Demander un conseil</button>' : ""}`;
    return;
  }
  const stale = a.mealsKey !== mealsKey(list);
  const label = { ok: "Équilibré", reste: "De la marge", stop: "C'est assez" }[a.verdict] || "Conseil";
  el.innerHTML = `<div class="head"><span class="pill ${esc(a.verdict)}">${label}</span></div>
    <h3>${esc(a.titre)}</h3><p>${esc(a.conseil)}</p>
    ${(a.idees && a.idees.length) ? `<ul>${a.idees.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
    ${sample ? `<button class="refresh" id="advBtn">${stale ? "Mettre à jour le conseil" : "Redemander"}</button>` : ""}`;
}
const mealsKey = list => list.map(m => m.id).join(",");

function fillSettings() {
  if (document.activeElement && $("settings").contains(document.activeElement)) return;
  $("sKcal").value = profile.kcal; $("sFat").value = profile.fat; $("sSugar").value = profile.sugar; $("sProt").value = profile.prot;
  const p = profile.body || {};
  $("pSex").value = p.sex || ""; $("pAge").value = p.age || ""; $("pW").value = p.w || ""; $("pH").value = p.h || "";
  $("pAct").value = p.act || "1.3"; $("pGoal").value = p.goal || "lose";
}

/* ---------- status ---------- */
function showStatus(msg, err, busy) {
  const s = $("status");
  if (!msg) { s.hidden = true; return; }
  s.hidden = false; s.className = "status" + (err ? " err" : "");
  s.innerHTML = (busy ? '<span class="spin"></span>' : "") + esc(msg);
}

/* ---------- photo ---------- */
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => b ? res({ blob: b, url: c.toDataURL("image/jpeg", q) }) : rej(new Error("image")), "image/jpeg", q);
    };
    img.onerror = () => rej(new Error("Image illisible"));
    img.src = URL.createObjectURL(file);
  });
}
$("photoBtn").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const big = await shrink(f, 1280, 0.82);
    const small = await shrink(f, 160, 0.6);
    photoBlob = big.blob; photoThumb = small.url;
    $("prevImg").src = small.url; $("preview").hidden = false;
    if (!$("txt").value.trim()) analyze(); // lazy mode: photo alone goes straight in
  } catch (err) { showStatus("Je n'arrive pas à lire cette photo. Essaie avec une autre.", true); }
};
$("prevX").onclick = () => { photoBlob = null; photoThumb = null; $("preview").hidden = true; };

/* ---------- analyze ---------- */
let busy = false;
async function analyze() {
  const text = $("txt").value.trim();
  if (busy || (!text && !photoBlob)) return;
  if (!sample) { showStatus("L'analyse par Claude n'est pas disponible ici. Ouvre la page connecté à claude.ai.", true); return; }
  busy = true; showStatus(photoBlob ? "Je regarde ton assiette…" : "J'estime ce que tu as mangé…", false, true);
  const prompt = `Tu es un nutritionniste pragmatique. Estime le contenu nutritionnel de ce que la personne mange${photoBlob ? " (photo jointe)" : ""}.
${text ? `Ce qu'elle dit : « ${text} »` : "Pas de description, base-toi sur la photo."}
Si la quantité n'est pas claire, prends une portion adulte normale. Les plats belges/français sont fréquents.
Réponds UNIQUEMENT avec un objet JSON de cette forme exacte :
{"titre": "nom court du repas (max 40 caractères)",
 "aliments": [{"nom": "…", "quantite": "ex. 150 g, 1 tranche"}],
 "kcal": nombre, "proteines_g": nombre, "glucides_g": nombre, "sucres_g": nombre, "lipides_g": nombre, "fibres_g": nombre,
 "gras": "faible" | "moyen" | "élevé", "sucre": "faible" | "moyen" | "élevé",
 "remarque": "une phrase courte et utile, ou chaîne vide"}
Si ce n'est pas de la nourriture ni une boisson, mets kcal à 0 et explique dans remarque.`;
  try {
    const r = await sample.json(prompt, photoBlob ? { images: [photoBlob], cache: false } : { cache: false });
    if (!r || typeof r.kcal !== "number") throw { code: "invalid_json" };
    const ts = Date.now();
    const d = today();
    const id = "m_" + ts;
    const meal = {
      kind: "meal", date: d, ts, source: photoBlob ? (text ? "photo+texte" : "photo") : "texte", texte: text,
      titre: String(r.titre || text || "Repas").slice(0, 60),
      aliments: Array.isArray(r.aliments) ? r.aliments.slice(0, 12).map(a => ({ nom: String(a.nom || ""), quantite: String(a.quantite || "") })) : [],
      kcal: Math.round(r.kcal), proteines_g: +r.proteines_g || 0, glucides_g: +r.glucides_g || 0, sucres_g: +r.sucres_g || 0,
      lipides_g: +r.lipides_g || 0, fibres_g: +r.fibres_g || 0, gras: r.gras || "", sucre: r.sucre || "", remarque: String(r.remarque || "")
    };
    if (photoThumb) meal.thumb = photoThumb;
    day = d;
    await store.put(id, meal);
    $("txt").value = ""; photoBlob = null; photoThumb = null; $("preview").hidden = true;
    showStatus(`Noté : ${meal.titre}, environ ${meal.kcal} kcal.`);
    setTimeout(() => showStatus(""), 4000);
    busy = false;
    advise();
  } catch (e) {
    busy = false;
    const c = e && e.code;
    const msg = c === "not_granted" ? "Il faut autoriser la page à demander à Claude (menu Autorisations)."
      : c === "rate_limited" ? "Trop de demandes d'un coup. Réessaie dans une minute."
      : c === "image_rejected" || c === "images_unavailable" ? "La photo n'a pas pu être analysée. Décris le repas en quelques mots."
      : "Je n'ai pas réussi à estimer ce repas. Réessaie, ou décris-le en mots.";
    showStatus(msg, true);
  }
}
$("send").onclick = analyze;
$("txt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); analyze(); } });

/* ---------- advice ---------- */
let adviceBusy = false;
async function advise() {
  if (!sample || adviceBusy) return;
  const d = day, list = mealsOf(d); if (!list.length) return;
  const t = totals(list);
  adviceBusy = true; render();
  const now = new Date();
  const isToday = d === today();
  const prompt = `Tu es un coach nutrition bienveillant et direct. Tu tutoies. Français simple, pas de jargon.
Objectifs du jour : ${profile.kcal} kcal, lipides max ${profile.fat} g, sucres max ${profile.sugar} g, protéines visées ${profile.prot} g.${profile.body && profile.body.goal ? " But général : " + ({lose:"perdre un peu de poids",keep:"maintenir",gain:"prendre du poids"}[profile.body.goal]) + "." : ""}
${isToday ? `Il est ${now.getHours()}h${pad(now.getMinutes())}.` : "Bilan d'une journée passée."}
Repas notés :
${list.map(m => `- ${new Date(m.ts).getHours()}h : ${m.titre} — ${m.kcal} kcal, L ${Math.round(m.lipides_g)} g, S ${Math.round(m.sucres_g)} g, P ${Math.round(m.proteines_g)} g`).join("\n")}
Total : ${Math.round(t.kcal)} kcal, L ${Math.round(t.fat)} g, S ${Math.round(t.sugar)} g, P ${Math.round(t.prot)} g.
${isToday ? "Dis-lui s'il a assez mangé, s'il lui reste de la place et pour quoi, en tenant compte de l'heure et des repas restants probables." : "Fais un bilan court de cette journée."}
Réponds UNIQUEMENT en JSON :
{"verdict": "ok" | "reste" | "stop", "titre": "phrase courte (max 60 caractères)", "conseil": "2 phrases max", "idees": ["jusqu'à 3 idées concrètes avec kcal approximatives, ex. 'Un yaourt nature et une pomme (~150 kcal)'"]}
"reste" = il reste une vraie marge, "stop" = c'est assez ou trop pour aujourd'hui, "ok" = c'est équilibré.`;
  try {
    const r = await sample.json(prompt, { cache: false, modelTier: "quick" });
    await store.put("advice_" + d, {
      kind: "advice", date: d, ts: Date.now(), mealsKey: mealsKey(list),
      verdict: ["ok","reste","stop"].includes(r.verdict) ? r.verdict : "ok",
      titre: String(r.titre || ""), conseil: String(r.conseil || ""), idees: Array.isArray(r.idees) ? r.idees.slice(0, 3).map(String) : []
    });
  } catch (e) { /* keep last advice */ }
  adviceBusy = false; render();
}
$("advice").addEventListener("click", e => { if (e.target.id === "advBtn") advise(); });

/* ---------- meals list actions ---------- */
$("meals").addEventListener("click", async e => {
  const b = e.target.closest(".del"); if (!b) return;
  if (!b.classList.contains("confirm")) { b.classList.add("confirm"); b.textContent = "sûr ?"; setTimeout(() => { b.classList.remove("confirm"); b.textContent = "supprimer"; }, 3000); return; }
  await store.del(b.dataset.id);
});
$("week").addEventListener("click", e => { const b = e.target.closest("button[data-day]"); if (b) { day = b.dataset.day; render(); } });
$("prev").onclick = () => { day = addDays(day, -1); render(); };
$("next").onclick = () => { if (day < today()) { day = addDays(day, 1); render(); } };

/* ---------- settings ---------- */
$("calc").onclick = () => {
  const sex = $("pSex").value, age = +$("pAge").value, w = +$("pW").value, h = +$("pH").value, act = +$("pAct").value, goal = $("pGoal").value;
  if (!sex || !age || !w || !h) { $("sHint").textContent = "Remplis sexe, âge, poids et taille."; return; }
  const bmr = 10 * w + 6.25 * h - 5 * age + (sex === "h" ? 5 : -161); // Mifflin-St Jeor
  let k = bmr * act + (goal === "lose" ? -400 : goal === "gain" ? 300 : 0);
  k = Math.round(k / 50) * 50;
  $("sKcal").value = k;
  $("sFat").value = Math.round(k * 0.32 / 9);
  $("sSugar").value = Math.round(k * 0.10 / 4);
  $("sProt").value = Math.round(w * (goal === "lose" ? 1.4 : 1.2));
  $("sHint").textContent = "Calculé. Clique sur Enregistrer pour garder.";
};
$("saveS").onclick = async () => {
  profile = {
    kcal: +$("sKcal").value || DEF.kcal, fat: +$("sFat").value || DEF.fat, sugar: +$("sSugar").value || DEF.sugar, prot: +$("sProt").value || DEF.prot,
    body: { sex: $("pSex").value, age: +$("pAge").value || null, w: +$("pW").value || null, h: +$("pH").value || null, act: $("pAct").value, goal: $("pGoal").value }
  };
  $("sHint").textContent = "Enregistré.";
  document.activeElement && document.activeElement.blur();
  await store.put("profile", { kind: "profile", ...profile });
};

/* ---------- dictation ---------- */
let recording = false;
function setupDictation(d) {
  dict = d; $("mic").hidden = false;
  let base = "";
  d.onPartial(({ text }) => { $("txt").value = (base + " " + text).trim(); });
  d.onFinal(({ text }) => { base = (base + " " + text).trim(); $("txt").value = base; });
  d.onState(({ state, reason }) => {
    recording = state === "listening" || state === "starting";
    $("mic").classList.toggle("rec", recording);
    if (state === "idle") { $("txt").value = base; if (reason === "not_granted") $("mic").hidden = true; }
  });
  $("mic").onclick = () => {
    if (recording) { d.stop().catch(() => {}); return; }
    base = $("txt").value.trim();
    d.start({ language: "fr" }).catch(err => { if (err && err.code === "not_granted") $("mic").hidden = true; });
  };
}

/* ---------- boot ---------- */
store = makeLocalStore(); store.start();
(async () => {
  const c = window.claude;
  if (!c || !c.use) return;
  const [db, user, s, d] = await Promise.all(["db", "user", "sample", "dictation"].map(n => c.use(n).catch(() => null)));
  sample = s; render();
  if (d) setupDictation(d);
  if (db && user) {
    const uid = await user.id().catch(() => null);
    if (uid) { store = await makeDbStore(db, uid); store.start(); }
  }
})();
setInterval(() => { /* roll over at midnight */ if (day < today() && !mealsOf(day).length) { day = today(); render(); } }, 60000);
})();
</script>
